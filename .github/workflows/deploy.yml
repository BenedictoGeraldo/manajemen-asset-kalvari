name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Menuju direktori proyek..."
            cd /var/www/apps/manajemen-asset-kalvari

            echo "📥 Mengambil kode terbaru dari GitHub..."
            git pull origin main

            echo "🚀 Memastikan kontainer berjalan dan up-to-date..."
            docker compose up -d

            echo "📦 Menginstall dependensi Composer..."
            docker compose exec -T app composer install --no-dev --optimize-autoloader

            echo "🗄️ Menjalankan migrasi database..."
            docker compose exec -T app php artisan migrate --force

            echo "🎨 Membangun frontend assets (Vite)..."
            docker compose exec -T app npm install
            docker compose exec -T app npm run build

            echo "⚡ Mengoptimalkan cache Laravel..."
            docker compose exec -T app php artisan optimize:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache

            echo "🔄 Merestart Queue Worker..."
            docker compose exec -T queue php artisan queue:restart

            echo "✅ Deploy Berhasil!"
