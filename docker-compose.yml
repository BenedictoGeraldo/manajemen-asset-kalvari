services:
    app:
        build:
            args:
                user: laravel
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: pelita
        container_name: pelita-app
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
            - ./docker-compose/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - pelita
        ports:
            - "127.0.0.1:${APP_PORT:-8085}:8000"
        environment:
            QUEUE_CONNECTION: database
        command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
        depends_on:
            - db

    queue:
        build:
            args:
                user: laravel
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: pelita
        container_name: pelita-queue
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
            - ./docker-compose/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - pelita
        environment:
            QUEUE_CONNECTION: database
        command: "php artisan queue:work"
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: pelita-db
        hostname: db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-manajemen_asset}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - ./docker-compose/mysql:/docker-entrypoint-initdb.d
            - pelita_db_data:/var/lib/mysql
        networks:
            - pelita
        # Port MySQL tidak perlu diekspos ke host agar tidak bentrok dengan database lain di VPS.
        # Container app berkomunikasi langsung via network internal docker (host: db, port: 3306).
        # ports:
        #     - "127.0.0.1:3307:3306"

volumes:
    pelita_db_data:
        driver: local

networks:
    pelita:
        driver: bridge

