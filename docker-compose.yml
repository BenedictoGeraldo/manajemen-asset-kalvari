services:
    app:
        build:
            args:
                user: laravel
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: pelita
        container_name: pelita-app
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
            - ./docker-compose/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - pelita
        ports:
            - "127.0.0.1:${APP_PORT:-8085}:8000"
        environment:
            QUEUE_CONNECTION: database
        command: sh -c "if [ ! -f /var/www/vendor/autoload.php ]; then composer install --no-dev --optimize-autoloader; fi && php artisan serve --host=0.0.0.0 --port=8000"
        depends_on:
            - db

    queue:
        build:
            args:
                user: laravel
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: pelita
        container_name: pelita-queue
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
            - ./docker-compose/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - pelita
        environment:
            QUEUE_CONNECTION: database
        command: sh -c "while [ ! -f /var/www/vendor/autoload.php ]; do sleep 3; done && php artisan queue:work"
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: pelita-db
        hostname: db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-manajemen_asset}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_PASSWORD: ${DB_PASSWORD:-root}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - ./docker-compose/mysql:/docker-entrypoint-initdb.d
            - pelita_db_data:/var/lib/mysql
        networks:
            - pelita
        # Port MySQL di-bind ke localhost port 3310 agar bisa diakses lewat Navicat (SSH Tunnel)
        # Port 3309 sudah dipakai oleh abadiin_mysql, jadi 3310 aman dan tidak bentrok.
        ports:
            - "127.0.0.1:3310:3306"

volumes:
    pelita_db_data:
        driver: local

networks:
    pelita:
        driver: bridge

